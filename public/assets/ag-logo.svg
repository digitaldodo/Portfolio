<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Ansh Gupta monogram logo</title>
  <desc id="desc">A gold circular AG monogram with a subtle crimson glow on a transparent background.</desc>
  <defs>
    <radialGradient id="coin-face" cx="33%" cy="24%" r="72%">
      <stop offset="0" stop-color="#fff4b8" />
      <stop offset="0.32" stop-color="#e8c858" />
      <stop offset="0.62" stop-color="#c48b24" />
      <stop offset="1" stop-color="#735017" />
    </radialGradient>
    <linearGradient id="gold-edge" x1="90" x2="420" y1="60" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff2a8" />
      <stop offset="0.44" stop-color="#d4af37" />
      <stop offset="0.72" stop-color="#8d641c" />
      <stop offset="1" stop-color="#f7da72" />
    </linearGradient>
    <linearGradient id="inner-shadow" x1="118" x2="400" y1="116" y2="398" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4d0715" />
      <stop offset="0.55" stop-color="#140b0c" />
      <stop offset="1" stop-color="#68141d" />
    </linearGradient>
    <filter id="crimson-glow" x="-26%" y="-26%" width="152%" height="152%">
      <feGaussianBlur stdDeviation="13" result="blur" />
      <feColorMatrix
        in="blur"
        type="matrix"
        values="1 0 0 0 0.78  0 0.22 0 0 0.02  0 0 0.22 0 0.08  0 0 0 0.78 0"
      />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="soft-depth" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#000000" flood-opacity="0.46" />
      <feDropShadow dx="0" dy="-2" stdDeviation="2" flood-color="#fff0a0" flood-opacity="0.38" />
    </filter>
    <clipPath id="coin-clip">
      <circle cx="256" cy="256" r="188" />
    </clipPath>
  </defs>

  <g filter="url(#crimson-glow)">
    <circle cx="256" cy="256" r="214" fill="#8f0e21" opacity="0.18" />
  </g>

  <g filter="url(#soft-depth)">
    <circle cx="256" cy="256" r="202" fill="url(#gold-edge)" />
    <circle cx="256" cy="256" r="184" fill="url(#inner-shadow)" stroke="#f4d975" stroke-width="10" />
    <circle cx="256" cy="256" r="165" fill="none" stroke="#2c1110" stroke-width="5" />
    <circle cx="256" cy="256" r="153" fill="none" stroke="#d6af3b" stroke-width="5" opacity="0.82" />
    <circle cx="256" cy="256" r="143" fill="none" stroke="#2c1110" stroke-width="5" opacity="0.82" />

    <g clip-path="url(#coin-clip)">
      <path
        d="M252 108H207c-67 34-111 101-111 176 0 41 13 80 38 113h52l33-58h-46c-11-17-18-36-20-57h68v115h31V108Z"
        fill="url(#coin-face)"
      />
      <path d="M176 226c14-26 35-48 64-65v65H176Z" fill="#36100f" opacity="0.82" />
      <path d="M168 306h50l-34 58c-16-16-28-35-36-58h20Z" fill="#36100f" opacity="0.82" />
      <path
        d="M274 108h33v107l76-107h45l-74 101h52c20 25 31 56 31 89 0 37-14 72-39 99h-96v-58h74c7-13 10-27 10-41 0-11-2-22-6-32h-73v131h-33V108Z"
        fill="url(#coin-face)"
      />
      <path d="M307 163v57h-40l40-57Z" fill="#36100f" opacity="0.78" />
      <path
        d="M160 112c31-25 72-39 114-39 68 0 127 35 160 88"
        fill="none"
        stroke="#1b0f0e"
        stroke-linecap="round"
        stroke-width="9"
        opacity="0.82"
      />
      <path
        d="M169 126c29-22 65-33 105-33 59 0 111 30 141 75"
        fill="none"
        stroke="#e5c752"
        stroke-linecap="round"
        stroke-width="8"
      />
      <path
        d="M352 118l-80 112"
        fill="none"
        stroke="#f4d975"
        stroke-linecap="round"
        stroke-width="23"
      />
      <path
        d="M361 119l-83 116"
        fill="none"
        stroke="#2a0f0f"
        stroke-linecap="round"
        stroke-width="8"
        opacity="0.42"
      />
    </g>
  </g>
</svg>
