<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Ansh Gupta AG performance monogram</title>
  <desc id="desc">A sharp matte black AG monogram with gold geometry and a deep red performance accent.</desc>
  <defs>
    <linearGradient id="gold-stroke" x1="92" x2="420" y1="70" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff0a3" />
      <stop offset="0.33" stop-color="#d4af37" />
      <stop offset="0.68" stop-color="#9a6f20" />
      <stop offset="1" stop-color="#f4d875" />
    </linearGradient>
    <linearGradient id="matte-core" x1="110" x2="408" y1="90" y2="426" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a1a1a" />
      <stop offset="0.5" stop-color="#080808" />
      <stop offset="1" stop-color="#141414" />
    </linearGradient>
    <linearGradient id="red-cut" x1="330" x2="426" y1="120" y2="402" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ef4444" />
      <stop offset="0.58" stop-color="#9f1239" />
      <stop offset="1" stop-color="#450a0a" />
    </linearGradient>
    <filter id="premium-depth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#000000" flood-opacity="0.48" />
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#d4af37" flood-opacity="0.22" />
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#dc2626" flood-opacity="0.12" />
    </filter>
  </defs>

  <g filter="url(#premium-depth)">
    <path
